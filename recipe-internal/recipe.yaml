schema_version: 1

context:
  name: waves
  version: ${{ env.get("VERSION", default="0.0.0") }}
  python_min: 3.10

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  git: ..
  lfs: true

build:
  number: 0
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - if: unix
        then:
          - scons install --prefix=${PREFIX}
          - scons html-internal
          - rm -r ${SP_DIR}/${PKG_NAME}/docs
          - cp -r build/docs/html-internal ${SP_DIR}/${PKG_NAME}/docs
      - if: win
        then:
          - scons install --prefix=%PREFIX%
          - scons html-internal
          - Remove-Item -Recurse %SP_DIR%\%PKG_NAME%\docs
          - Copy-Item -Recurse build\docs\html-internal %SP_DIR%\%PKG_NAME%\docs
  python:
    entry_points:
      - odb_extract = waves._abaqus.odb_extract:main
      - waves = waves._main:main

requirements:
  host:
    - python
    - h5netcdf
    - h5py
    - matplotlib-base
    - networkx
    - numpy
    - pip
    - python-build
    - pyyaml
    - salib >=1.4.6
    - scipy >=1.7
    - scons >=4.6
    - setuptools >=77
    - setuptools_scm >=8
    - sphinx >=7.1
    - sphinx-argparse
    - sphinx-book-theme
    - sphinx-copybutton >=0.5.1
    - sphinx-design
    - sphinxcontrib-bibtex
    - xarray >=2024.10.0
  run:
    - python >=${{ python_min }}
    - h5netcdf
    - h5py
    - matplotlib-base
    - networkx
    - numpy
    - pyyaml
    - salib >=1.4.6
    - scipy >=1.7
    - scons >=4
    - xarray >=2024.10.0

tests:
  - python:
      imports:
        - waves
      pip_check: true
  - script:
      - if: unix
        then: ./run_test.sh
      - if: win
        then: ./run_test.bat
    requirements:
      run:
        - python
        - calculix
        - ccx2paraview >=3.2
        - fierro-fe-cpu
        # Remove trilinos-cpu explicit requirement when Fierro package(s) resolve the missing library issue
        # https://re-git.lanl.gov/aea/python-projects/waves/-/issues/865
        - trilinos-cpu <=15
        - gmsh
        - h5netcdf
        - h5py
        - matplotlib-base
        - meshio
        # Required to satisfy undocumented SALib dependencies on numpy version for the senstivity study tutorial
        - numpy >=2
        - pandas
        - pytest >=6
        - pytest-xdist
        - python-gmsh
        - pyyaml
        # Required to satisfy undocumented SALib dependencies on numpy version for the senstivity study tutorial
        - salib >=1.5.1
        - scipy >=1.7
        - scons
        - seaborn
        - sed
        - setuptools_scm
        - sphinx >=7.1
        - sphinx-argparse
        - sphinx-book-theme
        - sphinxcontrib-bibtex
        # Remove explicit dependency on VTK and rely on ccx2paraview when a VTK >=9.4 version fixes the macOS crash
        # https://re-git.lanl.gov/aea/python-projects/waves/-/issues/901
        - vtk <=9.3
        - xarray >=2024.10.0

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Computational science and engineering parameteric study workflows
  description: |
    WAVES (LANL code C23004) is a computational science and engineering workflow tool that integrates parametric studies
    with traditional software build systems.
  homepage: https://re-git.lanl.gov/aea/python-projects/waves
  repository: https://re-git.lanl.gov/aea/python-projects/waves
  documentation: https://aea.re-pages.lanl.gov/python-projects/waves/index.html
