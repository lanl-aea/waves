workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"

include: ".pipeline-common.yml"

stages:
  - test

default:
  tags:
    - macos
    - pn2301275

mac-developer-test:
  extends:
    - .nix-job-environment
    - .developer-test-no-third-party
  stage: test
  variables:
    conda_installation: "/Users/gitlab-runner/anaconda3"

mac-conda-build:
  extends:
    - .nix-job-environment
    - .conda-build
  stage: test
  variables:
    conda_installation: "/Users/gitlab-runner/anaconda3"
    environment_file: "conda-build.yml"
    recipe_directory: "recipe"

mac-pip-build:
  extends:
    - .nix-job-environment
    - .pip-build
  stage: test
  variables:
    conda_installation: "/Users/gitlab-runner/anaconda3"
    environment_file: "pip-build.yml"
